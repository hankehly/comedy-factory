[project]
name = "comedy-factory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic-ai>=2.27.0",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comedy_factory"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # pydantic_graph calls asyncio.get_event_loop() in sync runs, which
    # Python 3.12 deprecates; nothing to fix on our side (present in the
    # latest release, 2.27.0).
    "ignore:There is no current event loop:DeprecationWarning:pydantic_graph",
]
