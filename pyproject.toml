[project]
name = "comedy-factory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "pydantic-ai>=2.27.0",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comedy_factory"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.mypy]
files = ["comedy_factory", "tests", "main.py"]
# Plain mypy reads a `Field("default", validation_alias=...)` settings field
# as required (it only knows PEP 681's `default=` keyword); the pydantic
# plugin understands Field and model semantics.
plugins = ["pydantic.mypy"]
# Bodies of untyped functions (mostly test helpers) are not checked — mypy's
# default; silence the per-function reminder notes so real findings stand out.
disable_error_code = ["annotation-unchecked"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Correctness (pycodestyle errors, pyflakes) + import sorting. Ruff's wider
# default set (naming, datetime, mutability opinions) is intentionally off.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # pydantic_graph calls asyncio.get_event_loop() in sync runs, which
    # Python 3.12 deprecates; nothing to fix on our side (present in the
    # latest release, 2.27.0).
    "ignore:There is no current event loop:DeprecationWarning:pydantic_graph",
]

# Coverage is switched on by `just test` (`--cov --cov-report=term-missing`); a bare
# `uv run pytest` stays uninstrumented.
[tool.coverage.run]
source = ["comedy_factory"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# The suite is gated at full coverage — locally (`just test`) and in CI
# (.github/workflows/ci.yml) alike; pytest-cov reads this as its
# --cov-fail-under default.
fail_under = 100
# The `if __name__ == "__main__": main()` guard is the one line a test cannot
# reach by importing a module; every main() is exercised directly instead.
exclude_also = ['if __name__ == "__main__":']
