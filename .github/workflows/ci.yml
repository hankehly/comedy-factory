name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Secret prompt files are gitignored; tests only need them to exist,
      # so create them from their committed boilerplate templates.
      - name: Create missing prompts from templates
        run: |
          for template in prompts/*.template.md; do
            target="${template%.template.md}.md"
            test -f "$target" || cp "$template" "$target"
          done

      - name: Run tests
        run: uv run pytest --cov=comedy_factory --cov-report=term-missing
